<!-- Handwritten Font -->
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #1f1f1f, #0f0f0f);
    padding: 20px;
    user-select: none; /* disables copying */
  }

  .paper {
    background: #fdf6e3;
    max-width: 650px;
    width: 90%;
    height: 90vh;
    padding: 50px 40px;
    border-radius: 14px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    font-family: 'Patrick Hand', cursive; /* changed font for better readability */
    color: #3a2f2f;
    overflow-y: auto;
  }

  h1 {
    text-align: center;
    font-size: 36px;
    margin-bottom: 25px;
    font-family: 'Patrick Hand', cursive;
  }

  p {
    font-size: 20px;       /* slightly smaller for better flow */
    line-height: 2;        /* enough spacing between lines */
    white-space: pre-wrap; /* preserves line breaks */
    margin-bottom: 1.8em;
  }

  .signature {
    margin-top: 35px;
    text-align: right;
    font-size: 24px;
    font-style: italic;
  }

  .tap {
    margin-top: 25px;
    text-align: center;
    font-size: 14px;
    opacity: 0.6;
  }

  .paper::-webkit-scrollbar {
    display: none;
  }
</style>
